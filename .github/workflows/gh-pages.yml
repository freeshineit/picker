name: github pages
on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 8
      - run: pnpm install
      - run: pnpm run build
      - run: pnpm run docs

      # - name: Copy static files to docs
      - name: Ensure target directory exists
        run: mkdir -p docs/media

      - name: Copy JS to docs
        run: cp packages/picker/dist/index.umd.js docs/media/index.umd.js

      - name: Copy public styles to docs
        run: cp packages/picker/public/*.css docs/media/

      - name: Copy demo common.css to docs
        run: cp packages/picker/public/common.css docs/media/common.css

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: ./docs
          token: ${{ secrets.PAGE_GITHUB_TOKEN }}
